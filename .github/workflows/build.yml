name: Build LaTeX PDF

on:
  push:
    branches: [ main ]
  pull_request:


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          work_in_root_file_dir: true
          output_directory: build

      # 3️⃣ Delete previous release (optional)
      - name: Delete previous release
        uses: SoftProps/delete-release@v2
        with:
          tag_name: pdf-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # don’t fail if release doesn’t exist

      # 4️⃣ Create new release and upload PDF
      - name: Create GitHub Release with PDF
        uses: softprops/action-gh-release@v1
        with:
          tag_name: pdf-release
          name: PDF Release
          body: "Compiled PDF from latest build"
          files: build/main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
